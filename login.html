<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1a">
<title>Sign in | AI Productivity Workspace</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#172554 0,transparent 36%),radial-gradient(circle at 85% 80%,#312e81 0,transparent 34%),#080d1a;color:#eef2ff}
.auth-shell{width:min(100%,430px);padding:38px;border:1px solid #ffffff1c;border-radius:24px;background:#111a2bdc;box-shadow:0 24px 80px #0008;backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:30px}
.brand-mark{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);font-size:22px}
.brand strong{font-size:17px;letter-spacing:.2px}
.brand small{display:block;color:#94a3b8;margin-top:3px}
h1{font-size:27px;margin:0 0 8px}
.subtitle{color:#94a3b8;margin:0 0 28px;line-height:1.5}
label{display:block;font-size:13px;color:#cbd5e1;margin:17px 0 8px}
input{width:100%;padding:14px 15px;border-radius:11px;border:1px solid #334155;background:#0b1220;color:#f8fafc;font-size:15px;outline:none}
input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #3b82f633}
button{width:100%;padding:14px;border:0;border-radius:11px;margin-top:23px;background:linear-gradient(110deg,#2563eb,#7c3aed);color:white;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.switch{margin-top:20px;text-align:center;color:#94a3b8;font-size:14px}
.switch button{width:auto;margin:0;padding:0;background:none;color:#93c5fd;font-size:14px}
.message{min-height:20px;margin-top:14px;color:#fca5a5;font-size:13px;line-height:1.4}
@media(max-width:480px){.auth-shell{padding:27px 22px}}
</style>
</head>
<body>
<main class="auth-shell">
<div class="brand"><div class="brand-mark">✦</div><div><strong>AI Productivity Workspace</strong><small>One place for your workday</small></div></div>
<h1 id="auth-title">Welcome back</h1>
<p class="subtitle" id="auth-subtitle">Sign in to access your tasks, meetings and voice assistant.</p>
<form id="auth-form">
<label for="email">Email address</label>
<input type="email" id="email" autocomplete="email" placeholder="you@example.com" required>
<label for="password">Password</label>
<input type="password" id="password" autocomplete="current-password" placeholder="Enter your password" minlength="8" required>
<button id="auth-btn" type="submit">Sign in</button>
<div class="message" id="auth-message" role="alert"></div>
</form>
<div class="switch"><span id="switch-label">New here?</span> <button type="button" id="auth-toggle">Create an account</button></div>
</main>
<script>
let isLogin = true;
const form = document.getElementById('auth-form');
const title = document.getElementById('auth-title');
const subtitle = document.getElementById('auth-subtitle');
const button = document.getElementById('auth-btn');
const toggle = document.getElementById('auth-toggle');
const message = document.getElementById('auth-message');
const password = document.getElementById('password');

toggle.addEventListener('click', () => {
    isLogin = !isLogin;
    title.textContent = isLogin ? 'Welcome back' : 'Create your account';
    subtitle.textContent = isLogin ? 'Sign in to access your workspace.' : 'Create an account to keep your workspace synced securely.';
    button.textContent = isLogin ? 'Sign in' : 'Create account';
    toggle.textContent = isLogin ? 'Create an account' : 'Sign in instead';
    document.getElementById('switch-label').textContent = isLogin ? 'New here?' : 'Already have an account?';
    password.autocomplete = isLogin ? 'current-password' : 'new-password';
    message.textContent = '';
});

form.addEventListener('submit', async event => {
    event.preventDefault();
    message.textContent = '';
    button.disabled = true;
    button.textContent = isLogin ? 'Signing in…' : 'Creating account…';
    const email = document.getElementById('email').value.trim().toLowerCase();
    const passwordValue = password.value;

    try {
        const response = await fetch(isLogin ? '/api/auth/login' : '/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password: passwordValue })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Authentication failed.');
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('auth_user', JSON.stringify({ userId: data.userId, email: data.email }));
        window.location.replace('index.html');
    } catch (error) {
        message.textContent = error.message;
    } finally {
        button.disabled = false;
        button.textContent = isLogin ? 'Sign in' : 'Create account';
    }
});
</script>
</body>
</html>
