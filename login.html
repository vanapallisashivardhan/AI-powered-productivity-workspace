<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Workspace</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0f172a; color: white; }
    .auth-card { background: #1e293b; padding: 2rem; border-radius: 8px; width: 320px; text-align: center; }
    input { width: 90%; padding: 0.5rem; margin: 0.5rem 0; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: white; }
    button { width: 95%; padding: 0.6rem; margin-top: 1rem; border: none; border-radius: 4px; background: #3b82f6; color: white; cursor: pointer; }
    .toggle { margin-top: 1rem; font-size: 0.85rem; color: #94a3b8; cursor: pointer; }
  </style>
</head>
<body>

  <div class="auth-card">
    <h2 id="auth-title">Login</h2>
    <input type="email" id="email" placeholder="Email / User ID" required>
    <input type="password" id="password" placeholder="Password" required>
    <button id="auth-btn">Sign In</button>
    <div class="toggle" id="auth-toggle">Need an account? Register</div>
  </div>

  <script>
    let isLogin = true;

    const authTitle = document.getElementById('auth-title');
    const authBtn = document.getElementById('auth-btn');
    const authToggle = document.getElementById('auth-toggle');

    authToggle.addEventListener('click', () => {
      isLogin = !isLogin;
      authTitle.innerText = isLogin ? 'Login' : 'Register';
      authBtn.innerText = isLogin ? 'Sign In' : 'Sign Up';
      authToggle.innerText = isLogin ? 'Need an account? Register' : 'Already have an account? Login';
    });

    authBtn.addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';

      try {
        const response = await fetch(`http://localhost:3000${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Authentication failed');

        // Store Token & User metadata
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('auth_user', JSON.stringify({ userId: data.userId, email: data.email }));

        // Redirect to Dashboard
        window.location.href = 'index.html';
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
